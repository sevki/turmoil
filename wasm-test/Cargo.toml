[package]
name = "wasm-test"
version = "0.1.0"
authors = ["Turmoil Contributors"]
edition = "2021"


[dependencies]
wasm-bindgen = "0.2"
turmoil = { path = ".." }
console_error_panic_hook = "0.1"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["Window", "Performance"] }
tokio_with_wasm = { version = "0.8.2", features = ["rt", "time"] }
wasm = "0.0.0"
tracing-subscriber-wasm = "0.1.0"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]
